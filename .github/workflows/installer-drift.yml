name: Installer drift check

# static/install.sh is a reviewed, immutable copy of the installer in
# ai-agent-assembly/agent-assembly (scripts/install-cli.sh) as published in a
# release. This gate fails if the served copy's executable body drifts from that
# pinned release — on PRs/pushes that touch the copy, and weekly to detect
# tampering or regression against the pinned tag.
#
# WHY pinned: the site serves the RELEASED installer, so it must not be compared
# against unreleased upstream HEAD. Bump INSTALLER_SOURCE_REF and static/install.sh
# in the SAME change, and only after the matching release is published and its
# installer change has passed QA.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1' # Mondays — re-verify the served copy against the pinned release (detects tampering/regression)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      INSTALLER_SOURCE_REF: v0.0.1-rc.7 # immutable release tag, never a branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Compare served installer body against pinned release
        run: |
          set -euo pipefail
          SRC_URL="https://raw.githubusercontent.com/ai-agent-assembly/agent-assembly/${INSTALLER_SOURCE_REF}/scripts/install-cli.sh"
          curl -sSfL --proto '=https' "$SRC_URL" -o /tmp/source-install.sh
          # The served copy = the canonical installer + a short provenance-note header.
          # Compare only the executable body (from `set -eu` onward), which must stay
          # byte-identical to the source; the leading comment header may legitimately differ.
          sed -n '/^set -eu/,$p' static/install.sh      > /tmp/served-body.sh
          sed -n '/^set -eu/,$p' /tmp/source-install.sh > /tmp/source-body.sh
          if [ ! -s /tmp/served-body.sh ] || [ ! -s /tmp/source-body.sh ]; then
            echo "::error::could not locate the 'set -eu' body anchor in one of the files."
            exit 1
          fi
          if ! diff -u /tmp/source-body.sh /tmp/served-body.sh; then
            echo "::error::static/install.sh body has drifted from agent-assembly scripts/install-cli.sh at ${INSTALLER_SOURCE_REF} — re-sync the served copy."
            exit 1
          fi
          echo "OK: served installer body is byte-identical to agent-assembly scripts/install-cli.sh at ${INSTALLER_SOURCE_REF}."

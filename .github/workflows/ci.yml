name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint
        run: pnpm lint

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Format check
        run: pnpm format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
      # Proves the gate's own guards fire before the gate is believed: that a
      # trimmed catalogue fails, that the 14 fd-7 absolutes survive an emptied
      # one, and that the rewordings which escaped in AAASM-5730 are caught.
      # Needs no build/, so it runs first and fails fast. AAASM-5730.
      - name: Forbidden claims gate self-test
        run: pnpm claims:selftest
      - name: Build
        run: pnpm build
      # Runs against build/ rather than src/, because the published artefact is
      # what readers get: the same claim reaches them through HTML, the RSS and
      # Atom feeds, and the JS bundles, and a source-only grep sees none of
      # those. Stdlib Python only — no extra install step. AAASM-5696.
      - name: Forbidden claims (ADR 0033)
        run: pnpm claims:check
      # `/trust` publishes counts taken from the capability manifest in
      # `agent-assembly` (ADR 0034's layer T2). This asserts that the built page
      # still renders `metadata/trust-evidence.json` exactly — every claim term,
      # every area, every platform row and the provenance line — so a hand edit
      # to the page or to the generated module fails here rather than shipping a
      # number the manifest does not carry. Stdlib Python, no network.
      #
      # The other half of the loop, `pnpm trust:upstream`, is NOT run here: it
      # fetches the manifest from another repository, and whether a merge there
      # may turn this repository red is a cross-repo policy call that
      # AAASM-5587 deferred for `check-register-drift.py`. Run it by hand after
      # a manifest release. AAASM-5588.
      - name: Trust page matches the capability manifest projection
        run: pnpm trust:check

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Skips cleanly until the SONAR_TOKEN secret is provisioned, so CI
      # stays green in the meantime. Requires Automatic Analysis to be
      # disabled in the SonarCloud project (CI scan and Automatic Analysis
      # are mutually exclusive).
      - name: SonarCloud Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
